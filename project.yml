name: Keysound
options:
  bundleIdPrefix: com.minnnj
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.1"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: SX5KZM28U5
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  HangulEngine:
    path: Packages/HangulEngine
  KeyboardCore:
    path: Packages/KeyboardCore

targets:
  Keysound:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      # 축 선택 화면 미리듣기용 — 축마다 일반 키 1개(r2)와 기본 클릭만 앱 번들에 넣는다
      # 패턴은 SwitchSound.previewFileName 과 맞춘다
      - path: KeyboardExtension/Sounds
        includes:
          - "*_press_generic_r2.wav"
          - click_press.wav
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Keysound
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/Keysound.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.minnnj.keysound
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minnnj.keysound
        PRODUCT_NAME: Keysound
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: KeysoundKeyboard
        embed: true
    scheme:
      testTargets:
        - KeysoundTests

  # 호스트 앱 없는 로직 테스트 — 테스트할 Shared 파일만 직접 컴파일한다(추가하면 sources 에 한 줄)
  KeysoundTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/KeysoundTests
      - Shared/SwitchSound.swift
      - App/SoundCredits.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.minnnj.keysound.tests

  KeysoundKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - KeyboardExtension
      - Shared
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: Keysound
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: ko-KR
            RequestsOpenAccess: false
    entitlements:
      path: KeyboardExtension/KeysoundKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.minnnj.keysound
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minnnj.keysound.keyboard
        PRODUCT_NAME: KeysoundKeyboard
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: HangulEngine
      - package: KeyboardCore
